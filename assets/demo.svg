    <animate attributeName="opacity" from="0" to="1" begin="8.2s" dur="0.15s" fill="freeze"/>
  </text>
  <text x="20" y="302" font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="13.5" fill="#d29922" opacity="0">
