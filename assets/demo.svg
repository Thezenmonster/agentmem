    <animate attributeName="opacity" from="0" to="1" begin="7.8s" dur="0.15s" fill="freeze"/>
  </text>
  <text x="20" y="284" font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="13.5" fill="#d29922" opacity="0">
