name: Bug Report
description: Something broke or isn't working as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: tool
    attributes:
      label: What tool are you using?
      description: Claude Code, Cursor, Codex, Windsurf, or standalone CLI/Python
      placeholder: e.g. Claude Code
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What were you trying to do, and what went wrong?
      placeholder: I ran agentmem health and got...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: I expected it to...
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. pip install quilmem
        2. agentmem init --tool claude
        3. ...
    validations:
      required: false
  - type: textarea
    id: debug-info
    attributes:
      label: Output of `agentmem debug-info`
      description: Run `agentmem debug-info` and paste the output here. This captures your OS, Python version, DB state, and health in one go.
      render: shell
    validations:
      required: false
